name: tabsmith
run-name: tabsmith
on:
  push:
    branches:
      - '**'
jobs:
  Type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - name: Run type-check
        run: |
          make tc

  Run-Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - name: Run tests
        run: |
          make test

  Run-Linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - name: Run linter
        run: |
          make lint-check

  Check-Formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - name: Check formatting
        run: |
          make format-check
